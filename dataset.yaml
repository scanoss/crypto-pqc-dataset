#
# Post-quantum classification of algorithm families. The format is described in
# README.md and every change is listed in CHANGELOG.md.
version: 1.3.0
source_vintage: nist-2026-10
deadlines:
  cnsa2:
    source: "CNSA 2.0"
    migrate_by: 2030
    citation: "CNSA 2.0 — CNSA 1.0 asymmetric algorithms are deprecated for new National Security Systems equipment by 2030"
  nist-ir8547-signature:
    source: "NIST IR 8547"
    deprecated_after: 2030
    disallowed_after: 2035
    citation: "NIST IR 8547 (October 2026), Table 2 — quantum-vulnerable digital signature algorithms are deprecated after 2030 and disallowed after 2035"
  nist-ir8547-key-establishment:
    source: "NIST IR 8547"
    deprecated_after: 2030
    disallowed_after: 2035
    citation: "NIST IR 8547 (October 2026), Table 4 — quantum-vulnerable key-establishment schemes are deprecated after 2030 and disallowed after 2035"
  nist-ir8547-signature-and-key-establishment:
    source: "NIST IR 8547"
    deprecated_after: 2030
    disallowed_after: 2035
    citation: "NIST IR 8547 (October 2026), Tables 2 and 4 — quantum-vulnerable digital signature and key-establishment algorithms are deprecated after 2030 and disallowed after 2035"
# kind is what a vulnerable family is used for, and decides the migration path
# when a finding does not say its operation: signature (NIST IR 8547 Table 2),
# key-agreement (Table 4: key agreement, key transport, encryption, PAKEs) or
# dual (both tables, or a curve or group the family names for both uses).
# Families no table lists take the kind of the scheme they define; a family
# that is neither (a DRBG, a proof system, a pairing) is dual, so its path is
# never the cheaper one.
