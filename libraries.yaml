- library: c/gmssl
  purls: ["pkg:github/guanzhi/GmSSL"]
  kem:
    status: planned
    sources: ["https://github.com/guanzhi/GmSSL/commit/d8ce43ffef7d00738467f2a4287025339842c11c", "https://github.com/guanzhi/GmSSL/blob/master/src/kyber.c", "https://github.com/guanzhi/GmSSL/releases/tag/v3.2.0", "https://github.com/guanzhi/GmSSL/blob/v3.2.0/src/kyber.c"]
    note: "The maintainer's commit \"Update Kyber-512 to ML-KEM-768\" (2026-06-24) moved kyber_key_generate_ex, kyber_encap and kyber_decap to FIPS 203 SHA3/SHAKE on master, with no release yet. The CRYSTALS-Kyber of v3.2.0 (latest release, 2026-06-21) is set aside: pre-standard Kyber-512 with SM3 in place of SHA3/SHAKE."
  signature:
    status: none
    sources: ["https://github.com/guanzhi/GmSSL/releases/tag/v3.2.0", "https://github.com/guanzhi/GmSSL/issues/1762"]
    note: "No ML-DSA or Dilithium in v3.2.0 (latest release, 2026-06-21) or on master; its post-quantum signatures are the SM3-based hash signatures LMS/HSS, XMSS/XMSS^MT and SPHINCS+. A user's 2024 question on post-quantum plans (#1762) got no answer from the project."
  checked_at: 2026-11-11
- library: c/gnutls
  purls: ["pkg:github/gnutls/gnutls"]
  kem:
    status: planned
    sources: ["https://gitlab.com/gnutls/gnutls/-/merge_requests/1925", "https://github.com/gnutls/gnutls/blob/3.8.9/NEWS", "https://github.com/gnutls/gnutls/blob/3.8.13/configure.ac", "https://git.lysator.liu.se/nettle/nettle/-/blob/master/NEWS"]
    note: "ML-KEM (GNUTLS_PK_MLKEM768/1024, TLS 1.3 groups X25519MLKEM768, SecP256r1MLKEM768, SecP384r1MLKEM1024) works only in builds configured --with-leancrypto (or --with-liboqs before 3.8.10), off by default up to 3.8.13 (2026-04-29), so it is set aside. The maintainer made leancrypto the PQC backend only until Nettle, GnuTLS's default backend, gains PQC (MR 1925), and Nettle's unreleased 4.1 adds ML-KEM."
  signature:
    status: planned
    sources: ["https://gitlab.com/gnutls/gnutls/-/merge_requests/1925", "https://github.com/gnutls/gnutls/blob/3.8.9/NEWS", "https://github.com/gnutls/gnutls/blob/3.8.13/configure.ac", "https://git.lysator.liu.se/nettle/nettle/-/merge_requests/68"]
    note: "ML-DSA (GNUTLS_PK_MLDSA44/65/87, GNUTLS_SIGN_MLDSA44/65/87) since 3.8.9 works only in builds configured --with-leancrypto (or --with-liboqs before 3.8.10), off by default up to 3.8.13, so it is set aside. The maintainer made leancrypto the PQC backend only until Nettle gains PQC (MR 1925), and has a draft ML-DSA merge request open in Nettle."
  checked_at: 2026-11-11
- library: c/google-authenticator-libpam
  purls: [pkg:github/google/google-authenticator-libpam]
  kem:
    status: not_applicable
  signature:
    status: not_applicable
- library: c/gpgme
  purls: ["pkg:github/gpg/gpgme"]
  kem:
    status: none
    sources: ["https://github.com/gpg/gpgme/blob/gpgme-2.2.0/NEWS", "https://github.com/gpg/gpgme/blob/master/NEWS", "https://www.gnupg.org/documentation/manuals/gpgme/Generating-Keys.html"]
    note: "No ML-KEM API in GPGME 2.2.0 (latest, 2026-08-31): gpgme_op_createkey forwards an algorithm string to the GnuPG engine (\"see the GnuPG manual\"), so composite Kyber keys are selected only through GnuPG, and GPGME_PK_KYBER (since 1.24.1) only labels listed keys. The master branch adds a GPGME_PK_MLKEM key-listing value for the unreleased 2.3.0, which is a label, not an API to use ML-KEM."
  signature:
    status: none
    sources: ["https://github.com/gpg/gpgme/blob/gpgme-2.2.0/NEWS", "https://github.com/gpg/gpgme/blob/master/NEWS"]
    note: "No ML-DSA or Dilithium in GPGME 2.2.0 (latest, 2026-08-31). The master branch adds a GPGME_PK_MLDSA key-listing value for the unreleased 2.3.0, which is a label, not an API to sign with ML-DSA."
  checked_at: 2026-11-11
- library: c/hacl-star
  purls: ["pkg:github/project-everest/hacl-star"]
  kem:
    status: none
    sources: ["https://github.com/hacl-star/hacl-star/releases", "https://github.com/hacl-star/hacl-star/tree/main/code/frodo", "https://github.com/hacl-star/hacl-star/issues/228"]
    note: "No ML-KEM in v0.3.0 (latest C release, 2020) or main; the only post-quantum KEM is FrodoKEM. Issue #228 (2020) asked about post-quantum support in general, and was closed in 2022 without an ML-KEM plan."
  signature:
    status: none
    sources: ["https://github.com/hacl-star/hacl-star/releases", "https://github.com/hacl-star/hacl-star/issues/228"]
    note: "No ML-DSA or Dilithium in v0.3.0 (latest C release, 2020) or main, and no issue or pull request mentions ML-DSA. Issue #228 (2020) asked about post-quantum support in general, and was closed in 2022 without an ML-DSA plan."
  checked_at: 2026-11-11
- library: c/intel-ipsec-mb
  purls: [pkg:github/intel/intel-ipsec-mb]
  kem:
    status: not_applicable
  signature:
    status: not_applicable
- library: c/libgcrypt
  purls: ["pkg:github/gpg/libgcrypt"]
  kem:
    status: available
    since: "1.11.1"
    apis: [gcry_kem_keypair, gcry_kem_encap, gcry_kem_decap, GCRY_KEM_MLKEM512, GCRY_KEM_MLKEM768, GCRY_KEM_MLKEM1024]
    sources: ["https://github.com/gpg/libgcrypt/blob/libgcrypt-1.11.1/NEWS", "https://dev.gnupg.org/T7166", "https://github.com/gpg/libgcrypt/blob/libgcrypt-1.11.1/src/gcrypt.h.in", "https://github.com/gpg/libgcrypt/blob/libgcrypt-1.11.1/configure.ac"]
    note: "1.11.0 implemented Kyber after the FIPS 203 draft (ipd 2023-08-24) and is set aside; 1.11.1 applied the final FIPS 203 changes. Kyber is in the default public-key cipher list, so a default build ships it."
  signature:
    status: available
    since: "1.12.0"
    apis: [gcry_pk_genkey, gcry_pk_sign, gcry_pk_verify, GCRY_PK_MLDSA]
    sources: ["https://github.com/gpg/libgcrypt/blob/libgcrypt-1.12.0/NEWS", "https://dev.gnupg.org/T7640", "https://github.com/gpg/libgcrypt/blob/libgcrypt-1.12.0/cipher/pubkey-dilithium.c", "https://github.com/gpg/libgcrypt/blob/libgcrypt-1.12.0/configure.ac"]
    note: "ML-DSA-44/65/87 are selected by the S-expression key names dilithium2, dilithium3 and dilithium5. Dilithium is in the default public-key cipher list, so a default build ships it."
  checked_at: 2026-11-11
- library: c/libjwt
  purls: ["pkg:github/benmcollins/libjwt"]
  kem:
    status: none
    sources: ["https://github.com/benmcollins/libjwt/blob/v3.6.1/include/jwt.h", "https://github.com/benmcollins/libjwt/blob/v3.6.1/README.md"]
    note: "No ML-KEM or Kyber in 3.6.1 (latest, 2026-06-19) or master: JWE key management is dir, AES key wrap, AES-GCM key wrap, PBES2, RSA-OAEP and ECDH-ES. No issue or PR mentions ML-KEM."
  signature:
    status: none
    sources: ["https://github.com/benmcollins/libjwt/releases/tag/v3.5.0", "https://github.com/benmcollins/libjwt/blob/v3.6.1/README.md", "https://github.com/benmcollins/libjwt/blob/v3.6.1/CMakeLists.txt", "https://github.com/benmcollins/libjwt/issues/227"]
    note: "ML-DSA-44/65/87 (JWT_ALG_ML_DSA_44/65/87, AKP keys) exist since 3.5.0 only in a build with -DWITH_ML_DSA=ON, experimental and off by default, against OpenSSL 3.5+ or a PQC-enabled GnuTLS 3.8.10+, so a default build has no ML-DSA. The maintainer said in #227 it would stay experimental and enabled only by a manual cmake option; no plan to enable it by default was found."
  checked_at: 2026-11-11
