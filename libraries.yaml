  signature:
    status: planned
    sources: ["https://github.com/jedisct1/libsodium/commit/11216e4186b17093cbbe109664bf66e80cb6ee60", "https://github.com/jedisct1/libsodium/blob/master/src/libsodium/include/sodium/crypto_sign_mldsa44.h"]
    note: "The maintainer added ML-DSA-44 (crypto_sign_mldsa44_*) on master on 2026-10-15; it is not in 1.0.22 (latest release, 2026-04-09) or any earlier release."
  checked_at: 2026-11-11
- library: c/libssh
  purls: ["pkg:github/libssh/libssh-mirror"]
  kem:
    status: available
    since: "0.12.0"
    apis: [ssh_connect, ssh_handle_key_exchange, ssh_options_set, ssh_bind_options_set, SSH_OPTIONS_KEY_EXCHANGE, SSH_BIND_OPTIONS_KEY_EXCHANGE]
    sources: ["https://github.com/libssh/libssh-mirror/blob/libssh-0.12.0/CHANGELOG", "https://github.com/libssh/libssh-mirror/blob/libssh-0.12.0/src/kex.c", "https://github.com/libssh/libssh-mirror/blob/libssh-0.11.5/CHANGELOG"]
    note: "Hybrid SSH key exchanges mlkem768x25519-sha256 and mlkem768nistp256-sha256 (every crypto backend) and mlkem1024nistp384-sha384 (OpenSSL 3.5+ or libgcrypt backend) lead the default kex list, or are picked by name with the KEY_EXCHANGE options. The 0.11 branch, maintained in parallel up to 0.11.5, has no ML-KEM; sntrup761x25519-sha512 is not ML-KEM."
  signature:
    status: planned
    sources: ["https://gitlab.com/libssh/libssh-mirror/-/merge_requests/902", "https://github.com/libssh/libssh-mirror/blob/libssh-0.12.2/CHANGELOG", "https://github.com/libssh/libssh-mirror/blob/libssh-0.12.2/src/kex.c"]
    note: "No ML-DSA in 0.12.2 (latest) or master: host and user keys are RSA, ECDSA and Ed25519. Open merge request !902 (pure ML-DSA keys, 2026-10-21) is by a libssh developer, with Jakub Jelen as reviewer."
  checked_at: 2026-11-11
