      - https://github.com/openjdk/jdk17u/commit/a52c6bd7ad79bc3e7ef28dcada121ceffcb80175
    note: >-
      SunJCE provides KeyPairGenerator, KEM and KeyFactory under the names
      "ML-KEM", "ML-KEM-512", "ML-KEM-768" and "ML-KEM-1024" (default
