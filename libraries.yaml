  checked_at: 2026-11-11
- library: c/libvirt
  purls: ["pkg:github/libvirt/libvirt"]
  kem:
    status: none
    sources: ["https://github.com/libvirt/libvirt/blob/v12.9.0/docs/kbase/tlscerts.rst", "https://github.com/libvirt/libvirt/blob/v12.9.0/src/util/vircrypto.h"]
    note: "No ML-KEM API up to 12.9.0 (2026-11-02, latest) or master: the TLS transport leaves key exchange to GnuTLS and the system crypto policy, which can negotiate hybrid groups such as X25519-MLKEM768, and libvirt only passes a tls_priority string through. Its own crypto API is AES-256-CBC and MD5/SHA-256 hashing."
  signature:
    status: none
    sources: ["https://github.com/libvirt/libvirt/blob/v12.9.0/docs/kbase/tlscerts.rst", "https://github.com/libvirt/libvirt/blob/v11.10.0/NEWS.rst"]
    note: "No ML-DSA API up to 12.9.0 (latest) or master: ML-DSA certificates for the TLS transport are created with GnuTLS certtool and handled by GnuTLS. Since 11.10.0 the daemon and client load several certificate identities to ease a move to such certificates, which is configuration, not an API."
  checked_at: 2026-11-11
