- library: cpp/qtbase
  purls: ["pkg:github/qt/qtbase"]
  kem:
    status: none
    sources: ["https://github.com/qt/qtbase/blob/v6.12.0/src/network/ssl/qsslconfiguration.h", "https://github.com/qt/qtbase/blob/v6.12.0/src/plugins/tls/openssl/qsslcontext_openssl.cpp", "https://qt-project.atlassian.net/browse/QTBUG-151037", "https://github.com/openssl/openssl/blob/openssl-3.5.0/NEWS.md"]
    note: "Qt Network has no ML-KEM API of its own: QSslConfiguration::setEllipticCurves (QSslEllipticCurve) has no ML-KEM or hybrid group, and setBackendConfigurationOption(\"Groups\", ...) only passes a group string through to OpenSSL (SSL_CONF_cmd), which handles X25519MLKEM768 from OpenSSL 3.5. With the OpenSSL backend and OpenSSL 3.5 or newer, OpenSSL's own default keyshares (X25519MLKEM768 and X25519) apply. QTBUG-151037 (open, no maintainer response) asks to change the OpenSSL backend's default groups; it is not a plan to add an ML-KEM API."
  signature:
    status: available
    since: "6.11.0"
    apis: [QSsl::MlDsa, QSslKey::QSslKey]
    sources: ["https://code.qt.io/cgit/qt/qtreleasenotes.git/tree/qt/6.11.0/release-note.md", "https://github.com/qt/qtbase/commit/1493a6e8841", "https://github.com/qt/qtbase/blob/v6.11.0/src/network/ssl/qssl.h", "https://doc.qt.io/qt-6/qssl.html#KeyAlgorithm-enum"]
    note: "QSsl::MlDsa is a QSsl::KeyAlgorithm for loading ML-DSA-44, ML-DSA-65 and ML-DSA-87 keys into QSslKey; the parameter set comes from the key, Qt does not generate keys. Handled only by the OpenSSL TLS backend (Qt's preferred default), with OpenSSL 3.5 or newer or a provider with ML-DSA such as oqsprovider; the Schannel and Secure Transport backends do not handle it. 6.11.0 betas and RC set aside."
  checked_at: 2026-11-11
