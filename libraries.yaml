- library: c/libsodium
  purls: ["pkg:github/jedisct1/libsodium"]
  kem:
    status: available
    since: "1.0.22"
    apis: [crypto_kem_keypair, crypto_kem_seed_keypair, crypto_kem_enc, crypto_kem_dec, crypto_kem_xwing_keypair, crypto_kem_xwing_enc, crypto_kem_xwing_dec, crypto_kem_mlkem768_keypair, crypto_kem_mlkem768_seed_keypair, crypto_kem_mlkem768_enc, crypto_kem_mlkem768_dec]
    sources: ["https://github.com/jedisct1/libsodium/releases/tag/1.0.22-RELEASE", "https://github.com/jedisct1/libsodium/blob/1.0.22-RELEASE/src/libsodium/include/sodium/crypto_kem_mlkem768.h", "https://github.com/jedisct1/libsodium/blob/1.0.22-RELEASE/src/libsodium/include/sodium/crypto_kem.h", "https://doc.libsodium.org/public-key_cryptography/key_encapsulation", "https://doc.libsodium.org/advanced/ml-kem768"]
