    sources: ["https://learn.microsoft.com/en-us/dotnet/core/whats-new/dotnet-10/libraries", "https://learn.microsoft.com/en-us/dotnet/api/system.security.cryptography.mlkem", "https://github.com/dotnet/runtime/blob/v10.0.0/src/libraries/System.Security.Cryptography/ref/System.Security.Cryptography.cs", "https://github.com/dotnet/runtime/blob/v11.0.0/src/libraries/System.Security.Cryptography/ref/System.Security.Cryptography.cs"]
    note: "System.Security.Cryptography.MLKem; needs OpenSSL 3.5 or later, or Windows CNG with PQC support (MLKem.IsSupported). In 10.0.0 its PEM, PKCS#8 and SubjectPublicKeyInfo import/export are [Experimental] (SYSLIB5006); 11.0.0 drops that. The .NET 10 previews and the hybrid CompositeMLKem (11.0.0, still SYSLIB5006) are set aside. TLS key exchange is left to the OS stack: SslStream exposes no ML-KEM group selector."
  signature:
    status: available
    since: "10.0.0"
    apis: [MLDsa.GenerateKey, MLDsa.ImportMLDsaPublicKey, MLDsa.ImportMLDsaPrivateKey, MLDsa.ImportMLDsaPrivateSeed, MLDsa.SignData, MLDsa.VerifyData, MLDsaAlgorithm.MLDsa44, MLDsaAlgorithm.MLDsa65, MLDsaAlgorithm.MLDsa87]
    sources: ["https://learn.microsoft.com/en-us/dotnet/core/whats-new/dotnet-10/libraries", "https://learn.microsoft.com/en-us/dotnet/api/system.security.cryptography.mldsa", "https://github.com/dotnet/runtime/pull/119289", "https://github.com/dotnet/runtime/blob/v10.0.0/src/libraries/System.Security.Cryptography/ref/System.Security.Cryptography.cs", "https://github.com/dotnet/runtime/blob/v11.0.0/src/libraries/System.Security.Cryptography/ref/System.Security.Cryptography.cs"]
    note: "System.Security.Cryptography.MLDsa; needs OpenSSL 3.5 or later, or Windows CNG with PQC support (MLDsa.IsSupported). The .NET 10 what's-new page still calls MLDsa [Experimental], but dotnet/runtime#119289 (backported to 10.0) moved SYSLIB5006 to its PEM, PKCS#8, SubjectPublicKeyInfo, SignPreHash and SignMu members, as the 10.0.0 reference assembly shows. 11.0.0 also makes the PEM, PKCS#8 and SubjectPublicKeyInfo members and X509Certificate2 ML-DSA keys stable; CertificateRequest and X509SignatureGenerator.CreateForMLDsa stay experimental. SlhDsa and CompositeMLDsa are SYSLIB5006 in 10.0.0 and 11.0.0; the .NET 10 previews are set aside."
  checked_at: 2026-11-11
