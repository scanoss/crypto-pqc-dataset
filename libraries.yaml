    status: none
    sources:
      - https://github.com/wolfSSL/wolfssljni/blob/v1.18.0-stable/ChangeLog.md
      - https://github.com/wolfSSL/wolfssljni/pull/361
      - https://github.com/wolfSSL/wolfssl/blob/v5.9.2-stable/ChangeLog.md
    note: >-
      Since 1.18.0 the JSSE provider can authenticate TLS 1.3 with ML-DSA-44/65/87
