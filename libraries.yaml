  purls: ["pkg:github/mbed-tls/mbedtls"]
  kem:
    status: planned
    sources: ["https://github.com/Mbed-TLS/mbedtls/issues/9803", "https://mbed-tls.readthedocs.io/en/latest/project/roadmap/", "https://github.com/Mbed-TLS/mbedtls/releases/tag/mbedtls-4.2.0"]
