      - https://github.com/tink-crypto/tink-java/blob/v1.22.0/src/main/java/com/google/crypto/tink/signature/SignatureConfig2026.java
      - https://github.com/tink-crypto/tink-java/releases/tag/v1.24.0
      - https://repo1.maven.org/maven2/com/google/crypto/tink/tink/1.22.0/tink-1.22.0.pom
      - https://github.com/google/conscrypt/releases/tag/2.6.0
    note: >-
      ML-DSA-44/65/87 from 1.22.0, the first release where MlDsaSignKeyManager
      (key generation) is public; 1.19.0 shipped MlDsaParameters (ML-DSA-65/87 only;
      ML_DSA_44 from 1.22.0) and 1.21.0 added PEM import of ML-DSA-65/87, but key generation and the signing configuration were not
      public, so they are set aside. SignatureConfig.register() does not add
      ML-DSA: register MlDsaSignKeyManager and use SignatureConfig2026. Keys,
      signing and verifying run on Conscrypt, installed as a JCA provider
      (optional Maven dependency, ML-DSA from Conscrypt 2.6.0). Named parameters
      "ML_DSA_44", "ML_DSA_65", "ML_DSA_87" (and _RAW) can be passed to
      KeyTemplates.get. 1.24.0 added JWT ML-DSA and the composite
      MLDSA44-Ed25519-SHA512 and MLDSA65-Ed25519-SHA512 signatures.
