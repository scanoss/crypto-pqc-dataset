    note: "ML-DSA-44/65/87 gem signing (PR #9697, merged 2026-09-02) ships in 4.1.0.beta1 to beta3 only; the latest stable, 4.0.24, supports RSA, DSA and EC keys only for gem signing. Since 4.0.15 (PR #9615) the :ssl_client_cert: and :ssl_ca_cert: settings accept ML-DSA certificates for TLS, read through Ruby's openssl; that is not gem signing. In the betas, keys come from Gem::Security.create_key(\"ML-DSA-65\") or gem cert --build -A ML-DSA-65 and need OpenSSL 3.5 or later; certificate signing with ML-DSA needs Ruby OpenSSL 3.3 or later. The repository moved to github.com/ruby/rubygems."
