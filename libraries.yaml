      Since 4.2.8 Netty puts X25519MLKEM768 first in its default groups for
      those builds; a caller selects groups by name through
      SslContextBuilder.option(OpenSslContextOption.GROUPS, ...). GROUPS
      exists since 4.1.115 and 4.2.0 and passes any name to the native
      library, and an X25519MLKEM768 test through it dates from 4.2.5; both
      set aside because Netty itself did not handle ML-KEM. The 4.1 line
      (latest 4.1.140) has GROUPS but no ML-KEM default. Before 4.2.20 the
      lowercase name x25519mlkem768 was not converted and failed; the
      uppercase X25519MLKEM768 works. The JDK provider (the default without
      netty-tcnative) has no Netty group selector and uses the JDK's own
      named groups.
