  signature:
    status: planned
    sources: ["https://github.com/Mbed-TLS/mbedtls/issues/9803", "https://mbed-tls.readthedocs.io/en/latest/project/roadmap/", "https://github.com/Mbed-TLS/TF-PSA-Crypto/issues/637", "https://github.com/Mbed-TLS/TF-PSA-Crypto/issues/657", "https://github.com/Mbed-TLS/mbedtls/releases/tag/mbedtls-4.2.0", "https://github.com/Mbed-TLS/TF-PSA-Crypto/blob/tf-psa-crypto-1.2.0/include/psa/crypto_config.h"]
    note: "TF-PSA-Crypto 1.2.0, bundled in Mbed TLS 4.2.0, has an experimental mldsa-native driver that is off by default (TF_PSA_CRYPTO_PQCP_MLDSA_ENABLED), so it is set aside. Maintainers track ML-DSA in the PSA API and in the default config (TF-PSA-Crypto issues 637 and 657), and the roadmap lists ML-DSA initial support."
  checked_at: 2026-11-11
- library: c/mcl
