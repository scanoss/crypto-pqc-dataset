    note: "ML-DSA-44/65/87 keys on a PKCS#11 3.2 token, selected by the OpenSSL key type (EVP_PKEY_ML_DSA_44/65/87), and through the PKCS#11 provider by name; requires building against OpenSSL 3.5 or later with ML-DSA enabled."
  checked_at: 2026-11-11
