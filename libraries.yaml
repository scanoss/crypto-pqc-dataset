      adds the TLS 1.3 hybrid groups X25519MLKEM768 (first in the default
      list), SecP256r1MLKEM768 and SecP384r1MLKEM1024, selected by name with
      SSLParameters.setNamedGroups or jdk.tls.namedGroups; the 25.0.5 update
      also ships them. The 21.0.13 and 17.0.21 updates backport ML-KEM by
      algorithm name only, without the NamedParameterSpec constants or the
      hybrid TLS groups.
