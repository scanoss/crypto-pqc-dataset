      - com.wolfssl.WolfSSLSession.useKeyShare
      - com.wolfssl.WolfSSL.MLKEMEnabled
      - com.wolfssl.WolfSSL.WOLFSSL_X25519MLKEM768
      - com.wolfssl.WolfSSL.WOLFSSL_SECP256R1MLKEM768
      - com.wolfssl.WolfSSL.WOLFSSL_SECP384R1MLKEM1024
      - com.wolfssl.WolfSSL.WOLFSSL_ML_KEM_512
      - com.wolfssl.WolfSSL.WOLFSSL_ML_KEM_768
      - com.wolfssl.WolfSSL.WOLFSSL_ML_KEM_1024
    sources:
      - https://github.com/wolfSSL/wolfssljni/blob/v1.18.0-stable/ChangeLog.md
      - https://github.com/wolfSSL/wolfssljni/pull/361
      - https://github.com/wolfSSL/wolfssljni/blob/v1.18.0-stable/src/java/com/wolfssl/WolfSSL.java
      - https://github.com/wolfSSL/wolfssljni/blob/v1.18.0-stable/examples/README.md
      - https://github.com/wolfSSL/wolfssl/blob/v5.9.1-stable/ChangeLog.md
    note: >-
      TLS 1.3 named groups X25519MLKEM768, SecP256r1MLKEM768 and SecP384r1MLKEM1024
      (hybrids) and ML-KEM-512/768/1024 (pure), selected through the JNI methods above,
      SSLParameters.setNamedGroups (JDK 20+), the jdk.tls.namedGroups System property or
      the wolfjsse.enabledSupportedCurves Security property (group names as strings).
      Requires native wolfSSL built with ML-KEM, which is on by default from wolfSSL 5.9.1;
      the pure ML-KEM groups also need --enable-tls-mlkem-standalone. The OQS-codepoint
      hybrids (WOLFSSL_SECP256R1MLKEM512, WOLFSSL_X448MLKEM768, ...) need an experimental
      native build and are set aside. No Kyber or ML-KEM before 1.18.0.
