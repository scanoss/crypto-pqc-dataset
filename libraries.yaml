#
# PQC support per library of the rule set: one entry per library, keyed by its
# id (<lang>/<library>) and by its purls. The format is described in README.md. Libraries not researched yet are listed in
# testdata/libraries-pending.txt.
- library: c/aws-lc
  purls: ["pkg:github/aws/aws-lc"]
  kem:
    status: available
    since: "1.35.0"
    apis:
      - EVP_PKEY_CTX_kem_set_params
      - EVP_PKEY_kem_new_raw_public_key
      - EVP_PKEY_kem_new_raw_secret_key
      - EVP_PKEY_encapsulate
      - EVP_PKEY_decapsulate
      - NID_MLKEM512
      - NID_MLKEM768
      - NID_MLKEM1024
      - SSL_CTX_set1_groups
      - SSL_set1_groups
      - NID_X25519MLKEM768
      - NID_SecP256r1MLKEM768
      - NID_SecP384r1MLKEM1024
      - SSL_CTX_set1_group_ids
      - SSL_set1_group_ids
      - SSL_GROUP_X25519_MLKEM768
      - SSL_GROUP_SECP256R1_MLKEM768
      - SSL_GROUP_SECP384R1_MLKEM1024
      - SSL_GROUP_MLKEM512
      - SSL_GROUP_MLKEM768
      - SSL_GROUP_MLKEM1024
    sources:
      - https://github.com/aws/aws-lc/releases/tag/v1.35.0
      - https://github.com/aws/aws-lc/blob/v1.35.0/include/openssl/evp.h
      - https://github.com/aws/aws-lc/releases/tag/v1.35.1
      - https://github.com/aws/aws-lc/blob/v1.35.1/include/openssl/nid.h
      - https://github.com/aws/aws-lc/blob/v1.35.1/include/openssl/ssl.h
      - https://github.com/aws/aws-lc/releases/tag/v1.50.0
      - https://github.com/aws/aws-lc/blob/v1.50.0/include/openssl/nid.h
      - https://github.com/aws/aws-lc/blob/v5.6.0/include/openssl/ssl.h
    note: "Earlier releases had only pre-standard Kyber and ML-KEM IPD (NID_MLKEM*IPD), set aside; 1.35.0 moved to FIPS 203 in the default build, 1.35.1 added the X25519MLKEM768 and SecP256r1MLKEM768 TLS groups (also by name via SSL_CTX_set1_groups_list), 1.50.0 SecP384r1MLKEM1024. SSL_CTX_set1_group_ids / SSL_set1_group_ids with the SSL_GROUP_* ids since 5.6.0."
  signature:
    status: available
    since: "1.43.0"
    apis:
      - EVP_PKEY_CTX_pqdsa_set_params
      - EVP_PKEY_pqdsa_new_raw_public_key
      - EVP_PKEY_pqdsa_new_raw_private_key
      - EVP_PKEY_PQDSA
      - NID_MLDSA44
      - NID_MLDSA65
      - NID_MLDSA87
      - SSL_SIGN_MLDSA44
      - SSL_SIGN_MLDSA65
      - SSL_SIGN_MLDSA87
    sources:
      - https://github.com/aws/aws-lc/releases/tag/v1.40.0
      - https://github.com/aws/aws-lc/blob/v1.42.0/CMakeLists.txt
      - https://github.com/aws/aws-lc/releases/tag/v1.43.0
      - https://github.com/aws/aws-lc/blob/v1.43.0/include/openssl/evp.h
      - https://github.com/aws/aws-lc/blob/v1.43.0/include/openssl/nid.h
      - https://github.com/aws/aws-lc/releases/tag/v5.0.0
      - https://github.com/aws/aws-lc/blob/v5.0.0/include/openssl/ssl.h
    note: "ML-DSA shipped in 1.40.0-1.42.0 only behind the ENABLE_DILITHIUM build option (OFF by default), set aside; 1.43.0 removed the flag. ML-DSA as a TLS 1.3 signature scheme (SSL_SIGN_MLDSA44/65/87) since 5.0.0."
  checked_at: 2026-11-11
- library: c/blst
  purls: ["pkg:github/supranational/blst"]
  kem:
    status: none
    sources: ["https://github.com/supranational/blst/blob/v0.3.17/bindings/blst.h"]
    note: "BLS12-381 signature library (keygen, sign, verify, aggregation, hash-to-curve, pairing) with no KEM, key agreement or encryption API, and no ML-KEM or Kyber up to v0.3.17 (latest, 2026-07-24) or master."
  signature:
    status: none
    sources: ["https://github.com/supranational/blst/blob/v0.3.17/bindings/blst.h", "https://github.com/supranational/blst/releases/tag/v0.3.17"]
    note: "No ML-DSA or Dilithium in the source up to v0.3.17 (latest, 2026-07-24) or master; signatures are BLS12-381 only, and no issue or PR mentions ML-DSA or post-quantum."
  checked_at: 2026-11-11
