#
# PQC support per crypto_rules library: one entry per library, keyed by its
# id (<lang>/<library>) and by its purls. The format is described in README.md. Libraries not researched yet are listed in
# testdata/libraries-pending.txt.
- library: c/openssl
  purls: ["pkg:github/openssl/openssl"]
  kem:
    status: available
    since: "3.5.0"
    apis: [EVP_PKEY_CTX_new_from_name, EVP_PKEY_Q_keygen, EVP_KEM_fetch, EVP_PKEY_encapsulate_init, EVP_PKEY_decapsulate_init, SSL_CTX_set1_groups_list, SSL_set1_groups_list]
    sources: ["https://github.com/openssl/openssl/blob/openssl-3.5.0/CHANGES.md", "https://github.com/openssl/openssl/blob/openssl-3.5.0/NEWS.md", "https://docs.openssl.org/3.5/man7/EVP_PKEY-ML-KEM/", "https://docs.openssl.org/3.5/man7/EVP_KEM-ML-KEM/"]
    note: "Algorithm names ML-KEM-512, ML-KEM-768, ML-KEM-1024; TLS groups X25519MLKEM768 (default keyshare), SecP256r1MLKEM768, SecP384r1MLKEM1024, MLKEM512/768/1024. 3.5.0-alpha1 and 3.5.0-beta1 set aside. Enabled in a default build (no-ml-kem is opt-out)."
  signature:
    status: available
    since: "3.5.0"
    apis: [EVP_PKEY_CTX_new_from_name, EVP_PKEY_Q_keygen, EVP_SIGNATURE_fetch, EVP_PKEY_sign_message_init, EVP_PKEY_verify_message_init]
    sources: ["https://github.com/openssl/openssl/blob/openssl-3.5.0/CHANGES.md", "https://github.com/openssl/openssl/blob/openssl-3.5.0/NEWS.md", "https://docs.openssl.org/3.5/man7/EVP_SIGNATURE-ML-DSA/"]
    note: "Algorithm names ML-DSA-44, ML-DSA-65, ML-DSA-87. 3.5.0-alpha1 and 3.5.0-beta1 set aside. Enabled in a default build (no-ml-dsa is opt-out)."
  checked_at: 2026-11-11
- library: cpp/blst
  purls: ["pkg:github/supranational/blst"]
  kem:
    status: none
    note: "BLS12-381 signature library: keygen, sign, verify, aggregation, hash-to-curve and pairing; no KEM, key agreement or encryption API."
  signature:
    status: none
    sources: ["https://github.com/supranational/blst/blob/v0.3.17/README.md", "https://github.com/supranational/blst/releases/tag/v0.3.17"]
    note: "No ML-DSA or Dilithium in the source up to v0.3.17 (2026-07-24) or master; signatures are BLS12-381 only, and no issue or PR mentions ML-DSA or post-quantum."
  checked_at: 2026-11-11
- library: cpp/botan
  purls: ["pkg:github/randombit/botan"]
  kem:
    status: available
    since: "3.6.0"
    apis:
      - Botan::ML_KEM_PrivateKey::ML_KEM_PrivateKey
      - Botan::ML_KEM_PublicKey::ML_KEM_PublicKey
      - Botan::ML_KEM_Mode::ML_KEM_512
      - Botan::ML_KEM_Mode::ML_KEM_768
      - Botan::ML_KEM_Mode::ML_KEM_1024
      - Botan::PK_KEM_Encryptor::PK_KEM_Encryptor
      - Botan::PK_KEM_Decryptor::PK_KEM_Decryptor
      - Botan::TLS::Group_Params_Code::HYBRID_X25519_ML_KEM_768
      - Botan::TLS::Group_Params_Code::HYBRID_SECP256R1_ML_KEM_768
      - Botan::TLS::Group_Params_Code::ML_KEM_512
      - Botan::TLS::Group_Params_Code::ML_KEM_768
      - Botan::TLS::Group_Params_Code::ML_KEM_1024
      - Botan::TLS::Group_Params_Code::HYBRID_SECP384R1_ML_KEM_1024
    sources:
      - https://github.com/randombit/botan/blob/3.6.0/news.rst
      - https://github.com/randombit/botan/blob/3.6.0/src/lib/pubkey/kyber/ml_kem/ml_kem.h
      - https://github.com/randombit/botan/blob/3.6.0/src/lib/pubkey/kyber/kyber_common/kyber.h
      - https://github.com/randombit/botan/blob/3.6.0/src/lib/tls/tls_algos.h
      - https://github.com/randombit/botan/blob/3.7.0/src/lib/tls/tls_algos.h
      - https://github.com/randombit/botan/blob/3.8.0/src/lib/tls/tls_algos.h
      - https://github.com/randombit/botan/blob/3.14.1/news.rst
    note: "ML_KEM_PrivateKey/ML_KEM_PublicKey/ML_KEM_Mode are aliases of Kyber_PrivateKey/Kyber_PublicKey/KyberMode; the ML_KEM_* mode selects FIPS 203. String selectors: create_private_key(\"ML-KEM\", rng, \"ML-KEM-768\"), FFI botan_privkey_load_ml_kem, TLS policy groups \"x25519/ML-KEM-768\", \"secp256r1/ML-KEM-768\" (3.6.0), \"ML-KEM-512/768/1024\" (3.7.0, which also made x25519/ML-KEM-768 a default TLS group) and \"secp384r1/ML-KEM-1024\" (3.8.0). Pre-standard Kyber r3 (since 3.0.0) set aside; its TLS groups were removed in 3.7.0. The ml_kem module is in a default build."
  signature:
    status: available
    since: "3.6.0"
    apis:
      - Botan::ML_DSA_PrivateKey::ML_DSA_PrivateKey
      - Botan::ML_DSA_PublicKey::ML_DSA_PublicKey
      - Botan::ML_DSA_Mode::ML_DSA_4x4
      - Botan::ML_DSA_Mode::ML_DSA_6x5
      - Botan::ML_DSA_Mode::ML_DSA_8x7
      - Botan::PK_Signer::PK_Signer
      - Botan::PK_Verifier::PK_Verifier
    sources:
      - https://github.com/randombit/botan/blob/3.6.0/news.rst
      - https://github.com/randombit/botan/blob/3.6.0/src/lib/pubkey/dilithium/ml_dsa/ml_dsa.h
      - https://github.com/randombit/botan/blob/3.6.0/src/lib/pubkey/dilithium/dilithium_common/dilithium.h
      - https://github.com/randombit/botan/blob/3.14.1/news.rst
    note: "ML_DSA_PrivateKey/ML_DSA_PublicKey/ML_DSA_Mode are aliases of Dilithium_PrivateKey/Dilithium_PublicKey/DilithiumMode; ML_DSA_4x4, 6x5 and 8x7 are ML-DSA-44, -65 and -87. String selectors: create_private_key(\"ML-DSA\", rng, \"ML-DSA-6x5\"), FFI botan_privkey_load_ml_dsa. 3.14.0 added the FIPS 204 context string (PK_Signature_Options::with_context). Pre-standard Dilithium r3 (since 3.0.0) set aside. The ml_dsa module is in a default build."
  checked_at: 2026-11-11
