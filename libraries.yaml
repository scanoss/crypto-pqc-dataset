      - https://github.com/bcgit/bc-csharp/blob/release-2.5.0/crypto/src/crypto/signers/MLDsaSigner.cs
      - https://github.com/bcgit/bc-csharp/blob/release-2.5.0/crypto/src/crypto/parameters/MLDsaParameters.cs
      - https://www.bouncycastle.org/resources/new-release-bouncy-castle-c-2-7-0/
      - https://github.com/bcgit/bc-csharp/blob/release-2.7.0/crypto/src/tls/SignatureScheme.cs
    note: >-
      Pre-standard Dilithium (Org.BouncyCastle.Pqc namespace) and the 2.5.0
      betas set aside. MLDsaSigner and HashMLDsaSigner (pre-hash, parameter
