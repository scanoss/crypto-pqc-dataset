  purls: ["pkg:github/libssh2/libssh2"]
  kem:
    status: planned
    sources: ["https://github.com/libssh2/libssh2/pull/1644", "https://github.com/libssh2/libssh2/blob/master/RELEASE-NOTES", "https://github.com/libssh2/libssh2/blob/master/src/openssl.h", "https://github.com/libssh2/libssh2/blob/master/src/kex.c", "https://github.com/libssh2/libssh2/releases/tag/libssh2-1.11.1"]
    note: "No ML-KEM in 1.11.1 (latest, 2024-10-16). Hybrid mlkem768x25519-sha256, mlkem768nistp256-sha256 and mlkem1024nistp384-sha384 key exchanges were merged to master in PR #1644 (2026-04-03) for the next release, listed first and built only with the OpenSSL 3.5+ backend."
  signature:
