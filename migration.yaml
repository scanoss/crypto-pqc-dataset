# Reference data for the migration path: what moving a quantum-vulnerable use
# to ML-KEM / ML-DSA takes. Every row cites its source.

# The path of a finding whose primitive and operation are known.
paths:
  - primitive: key-agree
    path: redesign
    reason: "key agreement → KEM (Encapsulate/Decapsulate)"
    citation: "FIPS 203, Section 3.1 — a KEM establishes a shared key: one party encapsulates it, the other decapsulates it"
  - primitive: pke
    operations: [encrypt, decrypt]
    path: redesign
    reason: "key transport → KEM + AEAD"
    citation: "NIST SP 800-227, Section 5.2.1 — KEM-DEM public-key encryption: a KEM establishes the key and a symmetric scheme protects the data"
  - primitive: signature
    path: swap
    reason: "same sign/verify shape, different algorithm"
    citation: "FIPS 204, Section 5 — ML-DSA keeps the key generation, signing and verification interface"

# Key, ciphertext and signature sizes in bytes, classical and post-quantum.
sizes:
  - { algorithm: ML-KEM-768, item: encapsulation key, bytes: 1184, citation: "FIPS 203, Table 3" }
  - { algorithm: ML-KEM-768, item: ciphertext, bytes: 1088, citation: "FIPS 203, Table 3" }
  - { algorithm: ML-DSA-65, item: public key, bytes: 1952, citation: "FIPS 204, Table 2" }
  - { algorithm: ML-DSA-65, item: signature, bytes: 3309, citation: "FIPS 204, Table 2" }
  - { algorithm: X25519, item: public key, bytes: 32, citation: "RFC 7748, Section 6.1" }
  - { algorithm: Ed25519, item: signature, bytes: 64, citation: "RFC 8032, Section 5.1.6" }
  - { algorithm: RSA-2048, item: signature, bytes: 256, citation: "RFC 8017, Section 8.2.1 — the signature is k octets, the length of the modulus" }

