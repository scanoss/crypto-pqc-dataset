name: Release

on:
  push:
    tags: ["v*"]

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # The tag, the dataset version and the top changelog entry must name one release.
      - name: Check versions agree
        run: |
          tag="${GITHUB_REF_NAME#v}"
          file="$(sed -n 's/^version: *//p' dataset.yaml | head -1)"
          log="$(sed -nE 's/^## \[([0-9]+\.[0-9]+\.[0-9]+)\] - .*/\1/p' CHANGELOG.md | head -1)"
          echo "tag=$tag dataset=$file changelog=$log"
          [ "$tag" = "$file" ] && [ "$tag" = "$log" ]

      - name: Test
        run: go test ./...

      - name: Release notes
        # Stop at the next release heading or at the link references, not at any line starting with "[".
        run: |
          awk -v v="## [${GITHUB_REF_NAME#v}]" 'index($0, v)==1{f=1;next} /^## |^\[[^]]+\]: /{f=0} f' CHANGELOG.md > notes.md
          grep -q '[^[:space:]]' notes.md || { echo "no release notes for $GITHUB_REF_NAME in CHANGELOG.md"; exit 1; }

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md dataset.yaml
